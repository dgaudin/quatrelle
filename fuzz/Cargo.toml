# Fuzzing Quatrelle's readers of hostile input (network replies, message sources, cache and
# data files) with `cargo fuzz` on nightly, Linux or macOS: `cargo +nightly fuzz run -O mime_parse`.
# A workspace of its own, so the main build never needs nightly or libFuzzer. The targets are
# listed in `fuzz/README.md`.
package = { name = "quatrelle-fuzz", version = "0.0.0", edition = "2024", license = "MIT OR Apache-2.0", publish = false, metadata = { cargo-fuzz = true } }

workspace = { members = ["."] }

# One binary per target, each kept out of `cargo test`, `cargo doc` and `cargo bench`.
bin = [
    { name = "data_file", bench = false, test = false, doc = false, path = "fuzz_targets/data_file.rs" }, # an account's data file, compressed again by Compact Now
    { name = "html", bench = false, test = false, doc = false, path = "fuzz_targets/html.rs" }, # received HTML bodies and our own markup
    { name = "ical", bench = false, test = false, doc = false, path = "fuzz_targets/ical.rs" }, # calendar files and WebDAV replies
    { name = "http", bench = false, test = false, doc = false, path = "fuzz_targets/http.rs" }, # HTTP answers, downloads' ranges, GitHub's release list
    { name = "imap", bench = false, test = false, doc = false, path = "fuzz_targets/imap.rs" }, # a whole IMAP session from the server side
    { name = "index_text", bench = false, test = false, doc = false, path = "fuzz_targets/index_text.rs" }, # raw message sources read for search
    { name = "jmap", bench = false, test = false, doc = false, path = "fuzz_targets/jmap.rs" }, # JMAP replies, push events and URLs
    { name = "mime_parse", bench = false, test = false, doc = false, path = "fuzz_targets/mime_parse.rs" }, # raw message sources
    { name = "pgp", bench = false, test = false, doc = false, path = "fuzz_targets/crypto/pgp.rs" }, # OpenPGP keys, messages, signatures, Autocrypt
    { name = "pgp_mime", bench = false, test = false, doc = false, path = "fuzz_targets/crypto/pgp_mime.rs" }, # PGP/MIME, inline PGP, a message's keys; written for sending
    { name = "msg", bench = false, test = false, doc = false, path = "fuzz_targets/pst/msg.rs" }, # Outlook message files (.msg)
    { name = "pst", bench = false, test = false, doc = false, path = "fuzz_targets/pst/import.rs" }, # Outlook data file import
    { name = "pst_append", bench = false, test = false, doc = false, path = "fuzz_targets/pst/append.rs" }, # mail added to a damaged data file, and taken out again
    { name = "pst_item", bench = false, test = false, doc = false, path = "fuzz_targets/pst/item.rs" }, # a .pst item rebuilt from its properties
    { name = "pst_props", bench = false, test = false, doc = false, path = "fuzz_targets/pst/props.rs" }, # text in a data file's properties, by code page
    { name = "pst_recurrence", bench = false, test = false, doc = false, path = "fuzz_targets/pst/recurrence.rs" }, # a .pst appointment's recurrence and its changed occurrences
    { name = "pst_pim_text", bench = false, test = false, doc = false, path = "fuzz_targets/pst/pim_text.rs" }, # what an export keeps in a contact's and a task's text, and a task's rule as a pattern
    { name = "archive_tags", bench = false, test = false, doc = false, path = "fuzz_targets/archive_tags.rs" }, # Exchange's list of archive policy tags, read as hostile XML
    { name = "import_journal", bench = false, test = false, doc = false, path = "fuzz_targets/pst/journal.rs" }, # a data file import's journal, read back as a hostile cache file
    { name = "search", bench = false, test = false, doc = false, path = "fuzz_targets/search.rs" }, # the search box and its filters
    { name = "signature", bench = false, test = false, doc = false, path = "fuzz_targets/signature.rs" }, # the signature read against the sender
    { name = "scam_answer", bench = false, test = false, doc = false, path = "fuzz_targets/scam_answer.rs" }, # the scam check: a model's answer read as hostile text, the request built from the same bytes, the local signs
    { name = "text_first", bench = false, test = false, doc = false, path = "fuzz_targets/text_first.rs" }, # Exchange's and Graph's answers, read as a message's text
    { name = "tnef", bench = false, test = false, doc = false, path = "fuzz_targets/tnef.rs" }, # Outlook's winmail.dat and compressed RTF
    { name = "markdown", bench = false, test = false, doc = false, path = "fuzz_targets/notes/markdown.rs" }, # a note's Markdown, and the edits its window makes
    { name = "teams_html", bench = false, test = false, doc = false, path = "fuzz_targets/teams/html.rs" }, # a Teams message's HTML, read into its text
    { name = "teams_json", bench = false, test = false, doc = false, path = "fuzz_targets/teams/json.rs" }, # Graph's answers about chats, members, messages and presence, read into the model
    { name = "trust", bench = false, test = false, doc = false, path = "fuzz_targets/trust.rs" }, # the URLs and hosts servers hand out
    { name = "vcard", bench = false, test = false, doc = false, path = "fuzz_targets/vcard.rs" }, # contact cards
]

[dependencies]
libfuzzer-sys = "0.4"
# The Quatrelle crates under test, straight from this checkout.
quatrelle-jmap.path = "../crates/jmap" # the JMAP client
quatrelle-mime.path = "../crates/mime" # MIME, HTML and markup
quatrelle-model.path = "../crates/model" # iCalendar, vCard, search
quatrelle-net.path = "../crates/net" # IMAP, WebDAV, .pst
quatrelle-pgp.path = "../crates/pgp" # OpenPGP
rand_core = "0.6" # the numbers a key's new signatures take
quatrelle-store.path = "../crates/store" # the in-memory cache syncs write to; data files
outlook-pst-rw = "1.2.14" # the .pst reader and writer, from the fixed copy below (`pst_append`)
serde_json = "1" # Graph's answers

# `cargo fuzz ... -O` builds with this profile, debug assertions and overflow checks on.
[profile.release]
debug = 1
debug-assertions = true
overflow-checks = true

# The .pst reader and writer with the fixes Quatrelle needs, the copy in vendor/ that the main
# workspace's [patch.crates-io] takes too (`cargo xtask ci` checks it).
[patch.crates-io]
outlook-pst-rw = { path = "../vendor/outlook-pst-rw" }
