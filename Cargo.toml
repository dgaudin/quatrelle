[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `fuzz` is its own workspace (nightly, libFuzzer). `vendor` holds third-party crates copied in
# as they are (vendor/README.md): built as dependencies, never as members, so `cargo xtask ci`
# (fmt, clippy, tests) leaves them alone.
exclude = ["fuzz", "vendor"]

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Didier Gaudin <didier.gaudin@gmail.com>", "the ArtCraft Team and the MailCraft contributors"]
rust-version = "1.95"
repository = "https://github.com/dgaudin/quatrelle"
homepage = "https://github.com/dgaudin/quatrelle"

[workspace.dependencies]
# internal
quatrelle-model = { path = "crates/model" }
quatrelle-mime = { path = "crates/mime" }
quatrelle-store = { path = "crates/store" }
quatrelle-jmap = { path = "crates/jmap" }
quatrelle-print = { path = "crates/print" }
quatrelle-smime = { path = "crates/smime" }
quatrelle-pgp = { path = "crates/pgp" }
quatrelle-keys = { path = "crates/keys" }
quatrelle-spell = { path = "crates/spell" }
quatrelle-net = { path = "crates/net" }
quatrelle-engine = { path = "crates/engine" }
quatrelle-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
unicode-segmentation = "1"
# time zones: the IANA database built in (pure data, wasm-safe; MIT OR Apache-2.0)
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
# the Public Suffix List compiled in (a registrable domain: the "site" a server belongs to; pure data, wasm-safe; MIT OR Apache-2.0)
psl = "2"

# mail (all MIT and/or Apache-2.0)
# `full_encoding`: mail in Shift_JIS, GBK, Big5 and EUC-KR (without it those came out as U+FFFD).
mail-parser = { version = "0.11", features = ["full_encoding"] }
mail-builder = { version = "1", default-features = false }
html2text = { version = "0.17", features = ["css"] }
imap-proto = "0.17"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

# The model's text reading (search's folding, a letter at a time, on every event and message it
# checks) runs as std's lower-casing did, which std's own optimised build gave even to debug
# builds: a calendar search over 25,000 appointments took 0.94 s folded, 0.53 s before.
[profile.dev.package.quatrelle-model]
opt-level = 1

# mail-parser 0.11 has a `debug_assert!` that hostile mail reaches (a message in a message ended
# by the outer boundary; crates/mime/src/tests.rs): off, debug builds read it as release ones do.
[profile.dev.package.mail-parser]
debug-assertions = false

[profile.release]
opt-level = 3
lto = "thin"

# egui 0.37 and winit 0.30.13 as the Craft apps build them: storytold's forks, pinned to the
# same revisions as GridCraft, WordCraft, PdfCraft, DeckCraft and PhotoCraft. Each fix in them is
# listed in the fork's PATCHES.md; bump these with the other apps.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
# outlook-pst-rw 1.2.14, the .pst reader and writer in one crate (library `outlook_pst`), with
# the fixes Quatrelle needs (capped reads of a damaged file, trees that can't point back at
# themselves, attached messages, zero-byte files): the owner's copy (dgaudin/outlook-pst-rs) of
# MailCraft's branch craft/rw-1.2.14, whose PATCHES.md lists the fixes, copied into vendor/ at
# the revision MailCraft pins, because storytold's shared release refuses git dependencies from
# anywhere else (vendor/README.md: where it comes from and how to update it). fuzz/Cargo.toml
# takes the same copy (`cargo xtask ci` checks both alike). Dropped once a release has the fixes.
outlook-pst-rw = { path = "vendor/outlook-pst-rw" }
