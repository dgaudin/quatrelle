[package]
name = "quatrelle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Quatrelle: local-first mail, calendar and people in Rust, an open-source alternative to Outlook"
default-run = "quatrelle"

[lints]
workspace = true

[dependencies]
quatrelle-engine = { workspace = true }
quatrelle-net = { workspace = true }
quatrelle-ui-egui = { workspace = true }
# Without default features, so each is named: "clipboard" is copy and paste (eframe 0.37 made it
# a feature of its own; leaving it out leaves the app without a clipboard).
eframe = { workspace = true, features = ["clipboard", "default_fonts", "system_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# The local UTC offset for message times.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# Native file dialogs (attach, save as).
rfd = "0.17"
# Open attachments with the system's default app.
open = "5"
# Pictures pasted into a message.
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Desktop notifications for new mail (toasts, Notification Center, freedesktop notifications).
notify-rust = { version = "4", default-features = false, features = ["z"] }
# Decodes the window icon (assets/app-icon).
image = { version = "0.25", default-features = false, features = ["png"] }
# Passwords live in the system keychain, never in Quatrelle's files.
keyring = { version = "3.6", default-features = false }

# Linux's own malloc keeps what it frees: a session that had searched everything kept 690 MB
# after it was dropped, and a day's sync left 48 arenas of it, swapped out, in an Exchange user's
# Quatrelle. jemalloc's background thread gives freed memory back within seconds. x86-64 only: a
# jemalloc built for 4 KB pages stops at start on an ARM kernel with 16 or 64 KB ones; FreeBSD's
# malloc is jemalloc already.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
tikv-jemallocator = "0.6"
# `stats`: the memory in use, logged now and then.
tikv-jemalloc-ctl = { version = "0.6", features = ["stats"] }

[build-dependencies]
# Icon + VERSIONINFO for quatrelle.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
# Notifications under Quatrelle's name: its app id's name and icon, per user (`toast.rs`).
# The version ipconfig (the network crate's DNS settings) uses, so it's built once.
windows-registry = "0.6"
# One Quatrelle per data folder (`single_instance.rs`): Unix sockets on Windows, which std lacks.
# The version zbus brings, so it's built once.
uds_windows = "1.2"
# The envelope in the notification area while new mail is unread (`desktop/tray.rs`).
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
# Finder hands documents to an app through an `odoc` Apple event; winit 0.30 never sees it
# (see `src/apple_events.rs`). Hooking it takes Objective-C, so `unsafe`, which we forbid, and
# this small crate hides that behind a safe queue. WordCraft, PdfCraft, GridCraft and DeckCraft
# depend on it too. The `=` pin is deliberate: read what changed upstream before moving it.
fmv-macos-events = "=0.1.0"
# Quitting the Mac way (`apple_events.rs`): `terminate:` from the main queue, and an app menu
# whose Quit (⌘Q) asks first, as craft-libs' quit crate does. objc2, objc2-app-kit and dispatch2
# come in through eframe already; muda builds the menu.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSDockTile"] }
# The count of new mail on the Dock's icon (`desktop/tray.rs`).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
muda = { version = "0.21.2", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
# Dragging attachments out under X11 (XDND), in safe Rust; and the window's id for it. The
# version winit and arboard use, so it's built once.
x11rb = "0.13"
raw-window-handle = "0.6"
# GNOME's compositor leaves the title bar to the app: without this, winit draws a bare grey
# frame; with it, a title bar like the desktop's own (title, buttons, light and dark). Where
# the window manager draws title bars (KDE, X11), it still does.
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita", "x11"] }
# The desktop's light or dark style and accent colour (the XDG settings portal).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Waits on, and closes, reminder notifications (notify-rust's handle is async there). The
# version zbus uses, so it's built once.
async-io = "2"
# The envelope in the notification area while new mail is unread (`desktop/tray.rs`): a
# StatusNotifierItem over the zbus already here.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
# The drag test plays the user on a virtual X server (Xvfb).
x11rb = { version = "0.13", features = ["xtest"] }

# Dragging attachments out of the window to other apps (Linux and the BSDs: `xdnd.rs`).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"
