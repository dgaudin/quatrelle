[package]
name = "quatrelle-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Quatrelle on the command line: accounts, sync, list, read, search, send, and every engine command"

[lints]
workspace = true

[[bin]]
name = "quatrelle-cli"
path = "src/main.rs"

[dependencies]
quatrelle-engine = { workspace = true }
quatrelle-net = { workspace = true }
serde_json = { workspace = true }
# The system's own zone and offset, now (its zoneinfo, or Windows' own zone mapped by jiff).
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
iana-time-zone = "0.1"

[target.'cfg(windows)'.dependencies]
# Windows' own programs started by their full path (a copy of apps/quatrelle's windows_programs.rs).
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }

[dev-dependencies]
# The fake Graph server, for `teams check`'s test.
quatrelle-net = { workspace = true, features = ["fakes"] }
