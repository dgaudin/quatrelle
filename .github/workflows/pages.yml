name: Pages

# Quatrelle's site on GitHub Pages, https://dgaudin.github.io/quatrelle/: the landing page from
# `site/` (English at the root, French in `fr/`), with the screenshots of `docs/images/` and the app
# icon, and under `demo/` the browser version of the latest stable release
# (https://dgaudin.github.io/quatrelle/demo/?sample, the "Try it in your browser"). The demo is the
# release's own web zip rather than a new build, so it is exactly what was released; its paths are
# relative (`public_url = "./"`), so it runs from any folder. Old links to `/?sample` are sent on to
# `demo/` by the landing page.
# Runs when a stable release is published (pre-releases, the test builds, are left out), when the
# site changes on main, or by hand.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Put the site and the web app on Pages
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The site as it is on main, even for a release (an older tag may have no `site/`).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Put the landing page together
        run: |
          set -euo pipefail
          mkdir -p _site/images
          cp -r site/. _site/
          cp docs/images/*.png _site/images/
          icons=assets/app-icon
          cp "$icons/quatrelle.ico" _site/favicon.ico
          cp "$icons/hicolor/scalable/apps/ai.storyteller.quatrelle.svg" _site/images/quatrelle.svg
          for size in 64 256; do
            cp "$icons/hicolor/${size}x${size}/apps/ai.storyteller.quatrelle.png" "_site/images/quatrelle-${size}.png"
          done
      - name: Take the release's web app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Otherwise (a push, by hand): the latest stable release.
          if [ -z "${TAG}" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'quatrelle-web-*.zip' --dir web
          unzip -q web/quatrelle-web-*.zip -d web
          # The zip holds one folder, quatrelle-web-<version>/, with the page at its top.
          page=$(find web -mindepth 2 -maxdepth 2 -name index.html | head -n 1)
          test -n "$page"
          mv "$(dirname "$page")" _site/demo
          echo "Quatrelle $TAG for the web: $(du -sh _site/demo | cut -f1); the whole site: $(du -sh _site | cut -f1)"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
