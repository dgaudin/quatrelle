[package]
name = "quatrelle-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Quatrelle network layer (native only): IMAP client and sync, SMTP submission, per-account workers"

[lints]
workspace = true

[dependencies]
quatrelle-model = { workspace = true }
quatrelle-mime = { workspace = true }
quatrelle-smime = { workspace = true }
quatrelle-pgp = { workspace = true }
quatrelle-keys = { workspace = true }
# The system's randomness, for S/MIME's and OpenPGP's keys and signatures.
rand_core = { version = "0.6", features = ["getrandom"] }
# The roots the system trusts (Windows' and macOS' stores, Linux's bundle), for S/MIME signers.
rustls-native-certs = "0.8"
quatrelle-store = { workspace = true }
# the system's time zone, for calendar times written without one
iana-time-zone = "0.1"
quatrelle-jmap = { workspace = true }
imap-proto = { workspace = true }
lettre = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# SHA-256 and randomness for OAuth's PKCE (already rustls's crypto provider).
ring = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
# WebDAV answers (CalDAV, CardDAV).
quick-xml = "0.42"
# Outlook data files (.pst), read for importing and written for exporting (MIT; Microsoft's reader
# with a writer added, whose library keeps the reader's name, `outlook_pst`). Built from the
# fixed copy in vendor/ that the workspace's [patch.crates-io] takes.
outlook-pst-rw = "1.2.14"
# Outlook message files (.msg) are compound files (MS-CFB), read with cfb (MIT), as WordCraft
# reads .doc files.
cfb = "0.15"
# NTLM sign-in for on-premises Exchange (EWS): MD4, MD5 and HMAC (RustCrypto, MIT / Apache-2.0).
md4 = "0.11"
md-5 = "0.11"
hmac = "0.13"
# Room left on the disk, so downloading mail ahead never fills it (MIT / Apache-2.0; over
# rustix and windows-sys, already here).
fs4 = { version = "1.1", default-features = false }
# TCP keepalive on every connection, so one a gateway forgot is found dead in two minutes, not
# when IDLE ends ten minutes later (MIT / Apache-2.0; already here through lettre and tokio).
socket2 = { version = "0.6", features = ["all"] }
log = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The system's DNS resolvers (account autoconfiguration).
ipconfig = "0.3"
# The certificates Windows distrusts (`Disallowed`), refused even when among the roots.
schannel = "0.1"

[features]
# The fake Graph server, for other crates' tests (`teams_sample`): a dev-dependency only.
fakes = []

[dev-dependencies]
# The S/MIME round trip reads the test certificates (PEM).
der = { version = "0.7", features = ["pem"] }
proptest = "1"
