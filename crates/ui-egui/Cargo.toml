[package]
name = "quatrelle-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quatrelle egui front end (folders, message list, reading pane, compose); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
quatrelle-engine = { workspace = true }
# Spelling the composer: Hunspell dictionaries read natively, in the background.
quatrelle-spell = { workspace = true }
# egui's emoji and symbol fonts, as egui had them by default before 0.37: emoji in subjects and
# text, and symbols such as ▾, otherwise draw as empty boxes.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Attachment thumbnails (pictures arrive in mail, decoded with size limits).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Right-to-left text: the Unicode Bidirectional Algorithm, and fonts' character maps (the
# version egui's text layout uses).
unicode-bidi = "0.3"
# The version egui's own text (epaint) uses, so the font reader is built once.
skrifa = "0.44"
# Colour emoji from the system's emoji font (`look/emoji.rs`): shaped with the shaper egui's
# text uses (a flag, a skin tone or a family is a ligature in the font's own tables) and, for
# fonts of layered outlines (Segoe UI Emoji), drawn with the rasterizer egui's text uses; both
# on the versions epaint has, so each is built once.
harfrust = "0.12"
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline", "text"] }
# The system's interface language.
sys-locale = "0.3"
# The emoji picker's list (Insert › Emoji): Unicode's emoji, their groups, names and GitHub
# shortcodes, as data (no font: they're drawn as the rest of the text, look/emoji.rs).
emojis = "0.9"
# A clock that also runs in the browser (std's panics there): how long a calendar read takes to
# merge, and the calendar to draw, said in the log (the version winit and egui use).
web-time = "1.1"
# The interface icons (Fluent UI System Icons, SVG): drawn with a pure-Rust SVG renderer.
resvg = { version = "0.45", default-features = false }
# PDF attachment thumbnails: a pure-Rust rasterizer (no unsafe code).
hayro = { version = "0.8", default-features = false }

[target.'cfg(windows)'.dependencies]
# The system's code pages for Alt codes (`app/alt_code.rs`), from the registry; the version the
# app and ipconfig use, so it's built once.
windows-registry = "0.6"
