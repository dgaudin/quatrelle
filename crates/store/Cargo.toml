[package]
name = "quatrelle-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Quatrelle local-first cache: accounts, folders, per-folder sync state, message sources and pending offline changes on disk"

[lints]
workspace = true

[dependencies]
quatrelle-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# Native only (the browser keeps its cache in memory).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Each account's mail in one data file (`packed.rs`): a crash-safe, pure-Rust embedded database.
redb = "=4.4.0"
# What a data file keeps is compressed (deflate, pure Rust): mail and folder lists are text.
# flate2 reads it back; miniz_oxide writes it, called directly, since in the app another crate
# turns flate2's zlib-rs on, whose fast level hardly shrinks base64 (attachments) at all.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = "0.9"
# The Documents folder (where "Quatrelle Files" goes), wherever the system has put it.
dirs = "7"

[dev-dependencies]
# Changes made again on a list in one pass, held to one at a time over random lists.
proptest = "1"
