[package]
name = "quatrelle-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Quatrelle engine: the session, its command registry and the sans-I/O job/event loop (no network, wasm-safe)"

[lints]
workspace = true

[dependencies]
quatrelle-model = { workspace = true }
quatrelle-mime = { workspace = true }
quatrelle-smime = { workspace = true }
quatrelle-pgp = { workspace = true }
quatrelle-store = { workspace = true }
quatrelle-print = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# The scam check's fingerprint of what it judged (the same generation as the S/MIME crate's).
sha2 = "0.10"

[dev-dependencies]
# S/MIME tests read PEM and play the network layer's decrypting.
der = { version = "0.7", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Property tests of the list's index and arrangement (tests/mail/nav.rs).
proptest = "1"
